repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: myapp-dev
    chart: ./myapp
    namespace: dev
    values:
      - values-dev.yaml

  - name: myapp-staging
    chart: ./myapp
    namespace: staging
    values:
      - values-staging.yaml

  - name: myapp-prod
    chart: ./myapp
    namespace: production
    values:
      - values-prod.yaml
