apiVersion: batch/v1
kind: Job
metadata:
  name: myapp-prod-migration
  labels:
    helm.sh/chart: myapp-1.2.3
    app.kubernetes.io/name: myapp
    app.kubernetes.io/instance: myapp-prod
    app.kubernetes.io/version: "1.25"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: "nginx:1.25"
          imagePullPolicy: IfNotPresent
          command: ["echo", "Running database migration..."]
          env:
            - name: DATABASE_URL
              value: "postgresql://appuser:prodpassword@myapp-prod-postgresql/appdb-prod"

