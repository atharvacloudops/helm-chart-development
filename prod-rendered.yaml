            - name: empty-dir
              mountPath: /tmp
              subPath: tmp-dir
      volumes:
        - name: start-scripts
          configMap:
            name: myapp-prod-redis-scripts
            defaultMode: 0755
        - name: health
          configMap:
            name: myapp-prod-redis-health
