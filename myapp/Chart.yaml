apiVersion: v2
name: myapp
description: Production Helm chart for a multi-tier application
type: application
version: 1.2.3
appVersion: "1.25"

dependencies:
  - name: postgresql
    version: "13.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "18.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled