name: Helm CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint chart
        run: helm lint myapp/

      - name: Validate values schema
        run: |
          helm lint myapp/ --values values-dev.yaml
          helm lint myapp/ --values values-staging.yaml
          helm lint myapp/ --values values-prod.yaml

  template:
    name: Helm Template Validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Template dev
        run: helm template myapp-dev myapp/ --values values-dev.yaml

      - name: Template staging
        run: helm template myapp-staging myapp/ --values values-staging.yaml

      - name: Template prod
        run: helm template myapp-prod myapp/ --values values-prod.yaml

  package:
    name: Package and Publish Chart
    runs-on: ubuntu-latest
    needs: template
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Package chart
        run: |
          helm package myapp/
          ls -la myapp-*.tgz

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: myapp-*.tgz